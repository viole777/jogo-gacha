<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Gacha Game</title>
<style>
  /* ===== CARTUN BRUTALIST ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --ink: #111;
    --paper: #ffe9d6;
    --accent: #ff5e5b;
    --accent2: #ffc93c;
    --green: #3ddc84;
    --blue: #4f9dde;
    --purple: #b388ff;
    --shadow: 5px 5px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: 3px solid var(--ink); border-radius: 10px; box-shadow: var(--shadow-sm); font-weight: 800; transition: transform .1s, box-shadow .1s; }
  button:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
  button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: var(--shadow-sm); }

  /* ===== LOGIN ===== */
  #loginScreen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, var(--bg3), var(--bg) 60%);
    z-index: 100;
  }
  .login-box {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; box-shadow: 8px 8px 0 var(--ink);
    padding: 32px; width: 400px; max-width: 92vw;
  }
  .login-box h1 { font-size: 2.2em; text-align: center; letter-spacing: 1px; text-shadow: 3px 3px 0 rgba(0,0,0,.15); }
  .login-box .tagline { text-align: center; color: #555; margin-bottom: 20px; font-weight: 600; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 10px; background: #fff; }
  .tabs button.active { background: var(--accent2); }
  .form-group { margin-bottom: 12px; }
  .form-group label { font-size: .8em; font-weight: 800; display: block; margin-bottom: 4px; }
  .form-group input {
    width: 100%; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 10px;
    font-size: 14px; background: #fff; box-shadow: 3px 3px 0 var(--ink);
  }
  .btn-primary { width: 100%; padding: 12px; font-size: 1em; background: var(--accent); color: #fff; }
  .login-error { display: none; background: #ffd1d1; border: 3px solid var(--ink); border-radius: 8px; padding: 8px; margin-top: 10px; font-size: .8em; color: #a00; font-weight: 700; }

  /* ===== APP ===== */
  #app { display: none; height: 100vh; flex-direction: column; }

  /* Header */
  .topbar {
    background: var(--paper); border-bottom: 4px solid var(--ink);
    padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    box-shadow: 0 4px 0 rgba(0,0,0,.2); z-index: 10;
  }
  .logo { font-size: 1.2em; font-weight: 900; letter-spacing: 1px; margin-right: auto; }
  .bag-pill { background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 4px 12px; font-weight: 800; font-size: .85em; box-shadow: var(--shadow-sm); }
  .coin { background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 4px 12px; font-weight: 800; font-size: .85em; box-shadow: var(--shadow-sm); }
  .coin.gems { color: #d6336c; }
  .coin.gold { color: #c77d0d; }
  .icon-btn { background: var(--accent2); padding: 6px 10px; font-size: .85em; }
  .sound-btn { background: var(--green); padding: 6px 10px; font-size: .85em; }

  /* Layout */
  .layout { flex: 1; display: flex; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 170px; background: var(--bg2); border-right: 4px solid var(--ink);
    padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
  }
  .sidebar button { padding: 10px; font-size: .9em; background: var(--bg3); color: #fff; text-align: left; }
  .sidebar button:hover { background: var(--accent); }

  /* Main */
  .main { flex: 1; overflow-y: auto; padding: 16px; background: radial-gradient(circle at 50% 0%, var(--bg3), var(--bg)); }

  /* Banner */
  .banner-card {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 16px;
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px;
  }
  .banner-card h2 { font-size: 1.3em; }
  .banner-card .desc { color: #555; font-weight: 600; margin-bottom: 10px; }
  .banner-display { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 10px 0; }
  .banner-char { background: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 10px; text-align: center; width: 130px; box-shadow: var(--shadow-sm); }
  .banner-char .avatar { width: 80px; height: 80px; border-radius: 50%; background: #eee; border: 3px solid var(--ink); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 2.4em; overflow: hidden; }
  .banner-char .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pull-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .pull-btn { padding: 12px 22px; font-size: 1em; }
  .pull-btn.single { background: var(--green); }
  .pull-btn.multi { background: var(--accent); color: #fff; }
  #pullResults { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .result-card { background: #fff; border: 4px solid var(--ink); border-radius: 12px; padding: 8px; text-align: center; animation: pop .4s ease; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .rarity-secret { border-color: #ff3b3b; }
  .rarity-mythic { border-color: #ffc93c; }
  .rarity-legendary { border-color: #b388ff; }
  .rarity-epic { border-color: #4f9dde; }
  .rarity-rare { border-color: #74b9ff; }
  .rarity-common { border-color: #95a5a6; }
  .avatar { background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: .65em; font-weight: 900; text-transform: uppercase; border: 2px solid var(--ink); background: #fff; }

  /* Unidades - grade */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input[type=text] { padding: 8px 10px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; box-shadow: var(--shadow-sm); font-size: .9em; flex: 1; min-width: 150px; }
  .toolbar select { padding: 8px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; box-shadow: var(--shadow-sm); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .unit-card {
    background: #fff; border: 4px solid var(--ink); border-radius: 12px; padding: 10px;
    box-shadow: var(--shadow-sm); cursor: pointer; position: relative; transition: transform .15s, box-shadow .15s;
  }
  .unit-card:hover { transform: translate(-2px, -2px) rotate(-1deg); box-shadow: 6px 6px 0 var(--ink); }
  .unit-card.selected { outline: 4px solid var(--accent2); }
  .unit-card .avatar { width: 70px; height: 70px; border-radius: 12px; margin: 0 auto 6px; font-size: 2.2em; transition: transform .2s; }
  .unit-card:hover .avatar { transform: rotate(5deg) scale(1.05); }
  .unit-card .uname { font-weight: 900; font-size: .85em; text-align: center; line-height: 1.1; }
  .unit-card .sub { font-size: .65em; color: #666; text-align: center; font-weight: 700; }
  .unit-card .badges { position: absolute; top: 4px; left: 4px; display: flex; gap: 2px; }
  .unit-card .badge { background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; font-size: .6em; padding: 1px 4px; font-weight: 900; }
  .hp-bar { height: 8px; background: #ddd; border: 2px solid var(--ink); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .hp-bar .fill { height: 100%; background: var(--green); transition: width .4s ease; }
  .xp-bar { height: 5px; background: #ddd; border: 1px solid var(--ink); border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .xp-bar .fill { height: 100%; background: var(--purple); }
  /* Sombra colorida por elemento */
  .unit-card[data-element="fogo"] { box-shadow: 0 0 12px rgba(255,140,0,.5), var(--shadow-sm); }
  .unit-card[data-element="agua"] { box-shadow: 0 0 12px rgba(0,150,255,.5), var(--shadow-sm); }
  .unit-card[data-element="natureza"] { box-shadow: 0 0 12px rgba(60,200,80,.5), var(--shadow-sm); }
  .unit-card[data-element="trevas"] { box-shadow: 0 0 12px rgba(120,60,180,.5), var(--shadow-sm); }
  .unit-card[data-element="luz"] { box-shadow: 0 0 12px rgba(255,220,80,.5), var(--shadow-sm); }
  .unit-card[data-element="magia"] { box-shadow: 0 0 12px rgba(180,80,255,.5), var(--shadow-sm); }
  .unit-card[data-element="ouro"] { box-shadow: 0 0 12px rgba(255,200,0,.5), var(--shadow-sm); }
  .unit-card[data-element="vazio"] { box-shadow: 0 0 12px rgba(100,100,120,.5), var(--shadow-sm); }
  .unit-card[data-element="pedra"] { box-shadow: 0 0 12px rgba(150,120,80,.5), var(--shadow-sm); }
  .unit-card[data-element="espírito"] { box-shadow: 0 0 12px rgba(80,200,220,.5), var(--shadow-sm); }
  /* Badge de raridade animada */
  .rarity-badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: .65em; font-weight: 900; text-transform: uppercase; border: 2px solid var(--ink); background: #fff; }
  .rarity-badge.secret, .rarity-badge.mythic { animation: glowPulse 1.5s infinite; }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 4px rgba(255,60,60,.6); }
    50% { box-shadow: 0 0 14px rgba(255,60,60,1); }
  }

  /* Painel de detalhes */
  .details-panel {
    width: 300px; background: var(--paper); border-left: 4px solid var(--ink);
    padding: 14px; overflow-y: auto;
  }
  .details-panel .avatar { width: 100px; height: 100px; border-radius: 20px; margin: 0 auto 10px; font-size: 3em; }
  .details-panel h3 { font-size: 1.2em; text-align: center; }
  .stat-row { display: flex; justify-content: space-between; background: #fff; border: 3px solid var(--ink); border-radius: 8px; padding: 6px 10px; margin-top: 6px; font-size: .85em; font-weight: 700; }
  .details-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .details-actions button { padding: 8px; font-size: .8em; }
  .action-evolve { background: var(--purple); color: #fff; grid-column: 1 / -1; }
  .action-fav { background: var(--accent2); }
  .action-lock { background: var(--blue); color: #fff; }
  .action-team { background: var(--green); grid-column: 1 / -1; }
  .action-delete { background: #e74c3c; color: #fff; grid-column: 1 / -1; }

  /* Itens */
  .item-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .item-tabs button { padding: 8px 14px; font-size: .8em; background: var(--bg3); color: #fff; }
  .item-tabs button.active { background: var(--accent2); color: var(--ink); }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-card { background: var(--paper); border: 4px solid var(--ink); border-radius: 12px; padding: 10px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .item-card .info { flex: 1; }
  .item-card .iname { font-weight: 900; }
  .item-card .idesc { font-size: .72em; color: #555; }
  .item-card .qty { background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 2px 10px; font-weight: 900; }
  .item-card .use-btn { background: var(--green); padding: 6px 12px; font-size: .8em; }
  .pick-target { margin-top: 8px; }

  /* Modais */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 200; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--paper); border: 5px solid var(--ink); border-radius: 20px; box-shadow: 10px 10px 0 var(--ink); padding: 22px; width: 640px; max-width: 94vw; max-height: 86vh; overflow-y: auto; }
  .modal h2 { font-size: 1.4em; margin-bottom: 12px; }
  .modal-close { float: right; background: #fff; padding: 4px 10px; font-size: 1em; }
  .modal-list { display: flex; flex-direction: column; gap: 10px; }
  .mq-item { background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .mq-item .iname { font-weight: 900; }
  .claimable { color: var(--green); font-weight: 900; }
  .claimed { color: #999; }
  .progress-bar { height: 10px; background: #ddd; border: 2px solid var(--ink); border-radius: 5px; margin-top: 4px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: var(--green); }

  /* Toast */
  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: var(--paper); border: 4px solid var(--ink); border-radius: 12px;
    box-shadow: 5px 5px 0 var(--ink); padding: 10px 20px; font-weight: 900; z-index: 300;
    display: none; max-width: 90vw; text-align: center;
  }
  .toast.show { display: block; animation: toastIn .3s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* Confirmação dupla */
  .confirm-box { text-align: center; }
  .confirm-box p { margin-bottom: 14px; font-weight: 700; }
  .confirm-box button { margin: 0 6px; padding: 10px 20px; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-ok { background: var(--green); }

  /* ===== CENA DE BATALHA ===== */
  .battle-scene {
    background: linear-gradient(180deg, #1a1a2e 0%, #2d1b4e 50%, #1a1a2e 100%);
    border: 4px solid var(--ink); border-radius: 16px;
    padding: 16px; position: relative; overflow: hidden; min-height: 380px;
  }
  .battle-scene::before {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.4));
  }
  .battle-side { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 2; }
  .battle-side.left { float: left; width: 45%; }
  .battle-side.right { float: right; width: 45%; }
  .battle-avatar {
    width: 120px; height: 120px; border-radius: 20px; border: 4px solid var(--ink);
    background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center;
    box-shadow: 5px 5px 0 rgba(0,0,0,.5); position: relative;
  }
  .battle-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .battle-avatar.small { width: 70px; height: 70px; border-radius: 12px; }
  .battle-name { color: #fff; font-weight: 900; font-size: .85em; text-shadow: 2px 2px 0 #000; text-align: center; }
  .battle-hp-wrap { width: 100%; max-width: 180px; }
  .battle-hp-label { color: #fff; font-size: .65em; font-weight: 800; text-shadow: 1px 1px 0 #000; margin-bottom: 2px; }
  .battle-hp-bar { height: 14px; background: #333; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; position: relative; }
  .battle-hp-fill { height: 100%; background: var(--green); transition: width .5s ease; }
  .battle-hp-fill.low { background: #e74c3c; }
  .battle-hp-fill.mid { background: var(--accent2); }
  .battle-hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .6em; font-weight: 900; color: #fff; text-shadow: 1px 1px 0 #000; }
  .battle-team { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .battle-unit { text-align: center; }
  .battle-unit .battle-avatar.small { margin: 0 auto; }
  .battle-unit .battle-name { font-size: .7em; }
  .battle-unit .battle-hp-wrap { max-width: 70px; }
  .battle-unit .battle-hp-bar { height: 8px; }
  .battle-unit .battle-hp-text { font-size: .5em; }
  /* Shake */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
    20%, 40%, 60%, 80% { transform: translateX(6px); }
  }
  .shake { animation: shake .5s ease; }
  /* Dano flutuante */
  .dmg-num {
    position: absolute; font-weight: 900; font-size: 1.4em; color: #ff3b3b;
    text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 10;
    animation: floatUp 1s ease forwards;
  }
  .dmg-num.heal { color: var(--green); }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
  }
  /* Log de batalha */
  .battle-log {
    margin-top: 12px; background: rgba(0,0,0,.7); border: 3px solid var(--ink);
    border-radius: 10px; padding: 8px; max-height: 120px; overflow-y: auto;
    font-size: .75em; font-weight: 600; color: #ddd;
  }
  .battle-log div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .battle-log div:last-child { border-bottom: none; }
  .battle-log .log-player { color: var(--green); }
  .battle-log .log-boss { color: var(--accent); }
  .battle-log .log-death { color: #ff3b3b; font-weight: 900; }
  /* Confete */
  .confetti { position: fixed; top: -10px; width: 10px; height: 10px; z-index: 400; pointer-events: none; animation: confettiFall linear forwards; }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  /* Botões de batalha */
  .battle-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .battle-actions button { padding: 10px 18px; font-size: .9em; }
  .btn-skip { background: var(--accent2); }
  .btn-again { background: var(--green); }
  .btn-back { background: var(--blue); color: #fff; }
  /* Resultado */
  .battle-result { text-align: center; padding: 20px; }
  .battle-result h2 { font-size: 2em; margin-bottom: 10px; }
  .battle-result .result-icon { font-size: 4em; margin-bottom: 10px; }
  .drop-item { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 6px 12px; margin: 4px; font-weight: 800; font-size: .85em; }

  /* Loja */
  .shop-item { display: flex; align-items: center; gap: 10px; }
  .shop-item .item-icon { width: 44px; height: 44px; border-radius: 10px; border: 3px solid var(--ink); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.6em; flex-shrink: 0; }
  .shop-item .item-info { flex: 1; }
  .shop-item .item-price { font-weight: 900; font-size: .85em; }

  /* Ranking */
  .rank-row { display: flex; align-items: center; gap: 10px; }
  .rank-medal { font-size: 1.4em; width: 36px; text-align: center; }
  .rank-avatar { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--ink); overflow: hidden; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 1.2em; flex-shrink: 0; }
  .rank-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .rank-name { flex: 1; font-weight: 900; }
  .rank-rating { font-weight: 800; }
  .rank-row.top1 { background: linear-gradient(90deg, #ffd70022, #fff); border-color: #ffd700; }
  .rank-row.top2 { background: linear-gradient(90deg, #c0c0c022, #fff); border-color: #c0c0c0; }
  .rank-row.top3 { background: linear-gradient(90deg, #cd7f3222, #fff); border-color: #cd7f32; }
  .rank-row.me { outline: 4px solid var(--accent2); }
  .profile-button { display: flex; align-items: center; gap: 6px; max-width: 150px; overflow: hidden; }
  .profile-button .profile-mini-avatar { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; background: #eee; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .profile-mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-button .profile-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .public-profile { text-align: center; }
  .public-profile .profile-avatar { width: 90px; height: 90px; margin: 0 auto 10px; border-radius: 50%; border: 4px solid var(--ink); overflow: hidden; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 3em; }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* PvP */
  .pvp-opponent { display: flex; align-items: center; gap: 10px; }
  .pvp-opponent .opp-avatar { width: 44px; height: 44px; border-radius: 10px; border: 3px solid var(--ink); overflow: hidden; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 1.4em; flex-shrink: 0; }
  .pvp-opponent .opp-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pvp-opponent .opp-info { flex: 1; }

  /* Painel administrativo */
  .admin-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .admin-toolbar input, .admin-toolbar select { min-width: 0; padding: 9px 10px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; box-shadow: var(--shadow-sm); font-weight: 700; }
  .admin-toolbar input { flex: 1; }
  .admin-toolbar select { width: 140px; }
  .admin-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .admin-list-item span:first-child { overflow-wrap: anywhere; }

  /* Responsive */
  @media (max-width: 900px) {

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🎮 GACHA GAME</h1>
    <div class="tagline">Colete heróis lendários de vários animes!</div>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Entrar</button>
      <button id="tabRegister" onclick="switchTab('register')">Criar Conta</button>
    </div>
    <div id="loginForm">
<div class="form-group">
  <label>Email</label>
  <input
    id="loginEmail"
    type="email"
    placeholder="seu@email.com"
    autocomplete="username"
  >
</div>

<div class="form-group">
  <label>Senha</label>
  <input
    id="loginPassword"
    type="password"
    placeholder="Sua senha"
    autocomplete="current-password"
  >
</div>

<button class="btn-primary" onclick="login()">🎮 Entrar</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="form-group"><label>Username</label><input id="regUsername" type="text" placeholder="Nome de jogador"></div>
      <div class="form-group"><label>Email</label><input id="regEmail" type="email" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input id="regPassword" type="password" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn-primary" onclick="register()">✨ Criar Conta</button>
    </div>
    <div class="login-error" id="loginError"></div>

</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="logo">🎮 GACHA GAME</div>
    <div class="bag-pill" id="bagPill">📦 0/20</div>
    <div class="coin gems" id="gemsPill">💎 0</div>
    <div class="coin gold" id="goldPill">🪙 0</div>
    <button class="icon-btn profile-button" onclick="openProfile()" title="Editar perfil"><span class="profile-mini-avatar" id="profileMiniAvatar">🎭</span><span class="profile-label" id="profileLabel">Perfil</span></button>
    <button class="icon-btn" onclick="openDaily()">📅 Diário</button>

  <div class="layout">
    <div class="sidebar">
      <button onclick="showView('banners')">🎴 Banners</button>
      <button onclick="showView('units')">🗂️ Unidades</button>
      <button onclick="showView('items')">🎒 Itens</button>
      <button onclick="openBosses()">👹 Bosses</button>
      <button onclick="openMissions()">📜 Missões</button>
      <button onclick="openPvP()">⚔️ PvP</button>
      <button onclick="openRanking()">🏆 Ranking</button>
      <button onclick="openShop()">🏪 Loja</button>
      <button id="adminNav" onclick="showView('admin')" style="display:none;background:var(--accent)">🛡️ Admin</button>
    </div>

    <div class="main" id="mainView">
      <!-- Conteúdo dinâmico -->
    </div>

    <div class="details-panel" id="detailsPanel">
      <div class="empty">Selecione uma unidade na aba Unidades.</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle">Título</h2>
    <div class="modal-list" id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== Estado ======
let token = localStorage.getItem('gacha_token');
let currentBanner = null;
let userData = null;
let inventory = [];
let characters = [];
let teamIds = [];
let filteredCharacters = [];
let currentItemTab = 'all';
let pendingUseItem = null;
let detailsId = null;
let currentView = 'banners';
let soundOn = true;
let battleTimer = null;
let bannerRotationTimer = null;
let battleData = null;
let adminPlayers = [];

const RARITY_COLORS = { secret:'#ff3b3b', mythic:'#ffc93c', legendary:'#b388ff', epic:'#4f9dde', rare:'#74b9ff', common:'#95a5a6' };
const ELEMENT_COLORS = { fogo:'#ff8c00', agua:'#0096ff', natureza:'#3cc850', trevas:'#783cb4', luz:'#ffdc50', magia:'#b450ff', ouro:'#ffc800', vazio:'#646478', pedra:'#967850', 'espírito':'#50c8dc' };

// ====== Sons ======
const SOUNDS = {
  click: new Audio('/assets/sounds/attack.wav'),
  attack: new Audio('/assets/sounds/attack.wav'),
  hit: new Audio('/assets/sounds/hit.wav'),
  victory: new Audio('/assets/sounds/victory.wav'),
  defeat: new Audio('/assets/sounds/defeat.wav'),
  skill: new Audio('/assets/sounds/skill.wav'),
};
Object.values(SOUNDS).forEach(s => { s.volume = 0.3; });
function playSound(name){
  if(!soundOn) return;
  try{
    const s = SOUNDS[name];
    if(s){ s.currentTime = 0; s.play().catch(()=>{}); }
  }catch(e){}
}
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊 Som' : '🔇 Mudo';
  if(soundOn) playSound('click');
}

// ====== Utils ======
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => {
  if (c === '&') return '\x26amp;';
  if (c === '<') return '\x26lt;';
  if (c === '>') return '\x26gt;';
  if (c === '"') return '\x26quot;';
  return '\x26#39;';
}); }
function color(r){ return RARITY_COLORS[r] || '#888'; }
function elemColor(e){ return ELEMENT_COLORS[e] || '#888'; }
function fmt(n){ if(n==null||isNaN(n)) return '0'; const suf=[[1e18,'sx'],[1e15,'qd'],[1e12,'t'],[1e9,'b'],[1e6,'m'],[1e3,'k']]; for(const [v,s] of suf){ if(Math.abs(n)>=v){ const x=(n/v).toFixed(1).replace(/\.0$/,''); return x+s; } } return Math.floor(n).toString(); }
async function api(url, method = 'GET', body = null) {
  const h = { 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  const opts = { method, headers: h };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  const text = await r.text();
  let d = {};
  try { d = JSON.parse(text); } catch(e) {}
  if (!r.ok) {
    if (r.status === 401) {
      localStorage.removeItem('gacha_token');
      token = null;
    }
    const error=new Error(d.error || text || `Erro HTTP ${r.status}`);
    error.status=r.status;
    throw error;
  }
  return d;
}
function toast(msg, err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=err?'#ffd1d1':'var(--paper)';
  t.style.color=err?'#a00':'var(--ink)';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'), 3500);
}

// ====== Auth ======
function switchTab(tab){
  document.getElementById('tabLogin').classList.toggle('active',tab==='login');
  document.getElementById('tabRegister').classList.toggle('active',tab==='register');
  document.getElementById('loginForm').style.display=tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display=tab==='register'?'block':'none';
  document.getElementById('loginError').style.display='none';
}
function showLoginErr(m){ const e=document.getElementById('loginError'); e.textContent=m; e.style.display='block'; }
async function login(){
  try{
    const d=await api('/api/auth/login','POST',{email:document.getElementById('loginEmail').value,password:document.getElementById('loginPassword').value});
    token=d.token;
    localStorage.setItem('gacha_token',token);
    userData=d.user;
    updateProfileButton();
    await enterGame();
  }catch(e){ showLoginErr(e.message); }
}
async function register(){
  try{
    const d=await api('/api/auth/register','POST',{username:document.getElementById('regUsername').value,email:document.getElementById('regEmail').value,password:document.getElementById('regPassword').value});
    token=d.token;
    localStorage.setItem('gacha_token',token);
    userData=d.user;
    updateProfileButton();
    await enterGame();
    toast('✨ Conta criada!');
  }catch(e){ showLoginErr(e.message); }
}
function logout(){ token=null; localStorage.removeItem('gacha_token'); document.getElementById('app').style.display='none'; document.getElementById('loginScreen').style.display='flex'; }

async function enterGame(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  await refreshAll();
  showView('banners');
}

// ====== Dados ======
async function refreshAll(){
  await Promise.all([loadAccount(), loadInventory(), loadCharacters(), loadTeam()]);
}
async function loadAccount(){
  try{
    const d=await api('/api/account');
    userData=d.user;
    updateProfileButton();
    document.getElementById('adminNav').style.display=userData.is_admin===1?'block':'none';
    document.getElementById('bagPill').textContent=`📦 ${d.user.bag_count}/${d.user.bag_limit}`;
    document.getElementById('gemsPill').textContent=`💎 ${fmt(d.user.gems)}`;
    document.getElementById('goldPill').textContent=`🪙 ${fmt(d.user.gold)}`;
  }catch(e){
    if(e.status===401) throw e;
    toast(e.message,true);
  }
}
function updateProfileButton(){
  if(!userData) return;
  document.getElementById('profileLabel').textContent=userData.username;
  document.getElementById('profileMiniAvatar').innerHTML=userData.avatar_url?`<img src="${esc(userData.avatar_url)}" alt="">`:'🎭';
}
function openProfile(){
  if(!userData) return;
  openModal('👤 Meu Perfil',`
    <div class="public-profile">
      <div class="profile-avatar">${userData.avatar_url?`<img src="${esc(userData.avatar_url)}" alt="Foto de perfil">`:'🎭'}</div>
      <div class="form-group" style="text-align:left"><label>Nome público</label><input id="profileUsername" maxlength="20" value="${esc(userData.username)}"></div>
      <div class="form-group" style="text-align:left"><label>Foto de perfil</label><input id="profileAvatarFile" type="file" accept="image/*" onchange="previewProfileImage(event)"><small>Escolha uma imagem salva no seu dispositivo.</small><input id="profileAvatarUrl" type="hidden" value="${esc(userData.avatar_url || '')}"></div>
      <button class="btn-primary" onclick="saveProfile()">💾 Salvar perfil</button>
    </div>`);
}
function previewProfileImage(event){
  const file=event.target.files?.[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    toast('Escolha um arquivo de imagem',true);
    event.target.value='';
    return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    const preview=document.querySelector('.profile-avatar');
    if(preview) preview.innerHTML=`<img src="${esc(reader.result)}" alt="Prévia da foto">`;
  };
  reader.readAsDataURL(file);
}
function compressProfileImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Não foi possível ler a imagem'));
    reader.onload=()=>{
      const image=new Image();
      image.onerror=()=>reject(new Error('Imagem inválida'));
      image.onload=()=>{
        const maxSize=512;
        const scale=Math.min(1,maxSize/Math.max(image.width,image.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(image.width*scale));
        canvas.height=Math.max(1,Math.round(image.height*scale));
        const context=canvas.getContext('2d');
        context.fillStyle='#ffffff';
        context.fillRect(0,0,canvas.width,canvas.height);
        context.drawImage(image,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',.82));
      };
      image.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function saveProfile(){
  try{
    const username=document.getElementById('profileUsername').value;
    const file=document.getElementById('profileAvatarFile').files?.[0];
    const avatar_url=file?await compressProfileImage(file):document.getElementById('profileAvatarUrl').value.trim() || null;
    const d=await api('/api/account/profile','PUT',{username,avatar_url});
    userData={...userData,...d.profile};
    await loadAccount();
    closeModal();
    toast('👤 Perfil atualizado!');
  }catch(e){ toast(e.message,true); }
}
async function loadInventory(){
  try{
    const d=await api('/api/inventory');
    inventory=d.items;
    if(currentView==='items') renderItems();
  }catch(e){}
}
async function loadCharacters(){
  try{
    const d=await api('/api/account/characters');
    characters=d.characters;
    applyFilters();
    if(detailsId) renderDetails(detailsId);
    if(currentView==='units') renderUnitGrid();
  }catch(e){}
}
async function loadTeam(){
  try{
    const d=await api('/api/account/team');
    teamIds=d.team.map(c=>c.user_character_id);
  }catch(e){}
}

// ====== Views ======
function showView(view){
  currentView=view;
  detailsId=null;
  document.getElementById('detailsPanel').innerHTML='<div class="empty">Selecione uma unidade na aba Unidades.</div>';
  if(view==='banners') renderBannersView();
  else if(view==='units') renderUnits();
  else if(view==='items') renderItems();
  else if(view==='admin') renderAdmin();
}
function setViewHTML(html){ document.getElementById('mainView').innerHTML=html; }

// ====== Painel administrativo ======
async function renderAdmin(){
  setViewHTML(`
    <div class="admin-toolbar">
      <input id="adminSearch" type="search" placeholder="🔍 Buscar jogador por nome ou email">
      <select id="adminStatus" onchange="loadAdminPlayers()">
        <option value="all">Todos</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
      </select>
      <button onclick="loadAdminPlayers()">🔄 Atualizar</button>
    </div>
    <div id="adminSummary" class="admin-summary"></div>
    <div id="adminPlayers" class="admin-grid"><div class="empty">Carregando jogadores...</div></div>`);
  document.getElementById('adminSearch').addEventListener('keydown', (event) => {
    if(event.key === 'Enter') loadAdminPlayers();
  });
  await loadAdminPlayers();
}
async function loadAdminPlayers(){
  if(currentView!=='admin') return;
  const search=encodeURIComponent(document.getElementById('adminSearch')?.value.trim()||'');
  const status=encodeURIComponent(document.getElementById('adminStatus')?.value||'all');
  const container=document.getElementById('adminPlayers');
  if(container) container.innerHTML='<div class="empty">Carregando jogadores...</div>';
  try{
    const d=await api(`/api/admin/players?search=${search}&status=${status}`);
    adminPlayers=d.players;
    const summary=document.getElementById('adminSummary');
    if(summary) summary.innerHTML=`<div class="stat-row"><span>Jogadores</span><strong>${d.count}</strong></div><div class="stat-row"><span>Online</span><strong style="color:var(--green)">${d.online_count}</strong></div>`;
    if(!d.players.length){ if(container) container.innerHTML='<div class="empty">Nenhum jogador encontrado.</div>'; return; }
    if(container) container.innerHTML=d.players.map(renderAdminPlayer).join('');
  }catch(e){ if(container) container.innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
function renderAdminPlayer(player){
  const itemRows=player.items.length?player.items.map(item=>`<div class="admin-list-item"><span>${itemIcon(item)} ${esc(item.item_name)}</span><span>x${item.quantity}</span></div>`).join(''):'<div class="admin-meta">Nenhum item</div>';
  const unitRows=player.units.length?player.units.map(unit=>`<div class="admin-list-item"><span>${esc(unit.name)} · ${unit.rarity}</span><span>Lv.${unit.level}</span></div>`).join(''):'<div class="admin-meta">Nenhuma unidade</div>';
  const deleteButton=player.is_admin?'':`<button class="admin-delete" onclick="deleteAdminPlayer(${player.id})">🗑️ Apagar conta</button>`;
  return `<article class="admin-player">
    <div class="admin-player-header">
      <div class="admin-avatar">${player.avatar_url?`<img src="${esc(player.avatar_url)}" alt="">`:'🎭'}</div>
      <strong>${esc(player.username)}</strong>
      <span class="online-status ${player.is_online?'':'offline'}">${player.is_online?'● Online':'○ Offline'}</span>
    </div>
    <div class="admin-meta">ID ${player.id} · ${esc(player.email)}</div>

function scheduleBannerRotation(nextRotationAt){
  if(bannerRotationTimer) clearTimeout(bannerRotationTimer);
  const delay=Math.max(1000,new Date(nextRotationAt).getTime()-Date.now()+250);
  bannerRotationTimer=setTimeout(()=>{
    bannerRotationTimer=null;
    if(currentView==='banners') renderBannersView();
  },delay);
}

// ====== Banners ======
async function renderBannersView(){
  setViewHTML('<div class="empty">Carregando banners...</div>');
  try{
    const d=await api('/api/banners');
    if(!d.banners.length){ setViewHTML('<div class="empty">Sem banners disponíveis.</div>'); return; }
    currentBanner=d.banners[0];
    if(d.next_rotation_at) scheduleBannerRotation(d.next_rotation_at);
    const det=await api('/api/banners/'+currentBanner.id);
    const visible=det.items.filter(c=>c.rarity!=='secret');
    const leg=visible.filter(c=>c.rarity==='legendary');
    const myth=visible.filter(c=>c.rarity==='mythic');
    const others=visible.filter(c=>c.rarity!=='legendary'&&c.rarity!=='mythic');
    const left=leg[0]||others[0];
    const center=myth[0]||leg[1]||others[1];
    const right=leg[1]||others[2]||leg[0];
    const shown=[left,center,right].filter(Boolean);

    let cards=shown.map(c=>`
      <div class="banner-char rarity-${c.rarity}">
        <div class="avatar">${c.image_url?`<img src="${esc(c.image_url)}">`:'🎭'}</div>
        <div style="font-weight:900;font-size:.85em">${esc(c.name)}</div>
        <span class="rarity-badge ${c.rarity}" style="border-color:${color(c.rarity)};color:${color(c.rarity)}">${c.rarity}</span>
      </div>`).join('');

    setViewHTML(`
      <div class="banner-card">
        <h2>${esc(currentBanner.name)}</h2>
        <div class="desc">${esc(currentBanner.description||'')}</div>
        <div class="banner-display">${cards}</div>
        <div class="pull-row">
          <button class="pull-btn single" onclick="pullGacha(1)">🎯 Pull 1x (100💎)</button>
          <button class="pull-btn multi" onclick="pullGacha(10)">🔥 Pull 10x (1000💎)</button>
        </div>
      </div>
      <div id="pullResults"></div>`);
  }catch(e){
    setViewHTML('<div class="empty">Erro ao carregar banners.</div>');
  }
}
async function pullGacha(qty){
  if(!currentBanner) return;
  try{
    const d=await api(`/api/banners/${currentBanner.id}/pull`,'POST',{quantity:qty});
    const hasRare=d.results.some(c=>['secret','mythic'].includes(c.rarity));
    playSound(hasRare?'victory':'skill');
    const box=document.getElementById('pullResults');
    box.innerHTML=d.results.map((c,i)=>`
      <div class="result-card rarity-${c.rarity}" style="animation-delay:${i*0.08}s">
        <div class="avatar" style="width:60px;height:60px;font-size:2em;margin:0 auto 6px;border:3px solid var(--ink);border-radius:50%">
          ${c.image_url?`<img src="${esc(c.image_url)}">`:'🎭'}
        </div>
        <div style="font-weight:900;font-size:.8em">${esc(c.name)}</div>
        <span class="rarity-badge ${c.rarity}" style="border-color:${color(c.rarity)};color:${color(c.rarity)}">${c.rarity}</span>
        <div style="font-size:.65em;color:#666;font-weight:700;margin-top:4px">HP ${c.hp_formatted} · ATK ${c.atk_formatted}</div>
      </div>`).join('');
    toast(hasRare?'🎉 SORTE GRANDE!':'Pull realizado!');
    await refreshAll();
  }catch(e){ toast(e.message,true); }
}

function applyFilters(){
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const rf=(document.getElementById('filterRarity')?.value||'all');
  const ef=(document.getElementById('filterElement')?.value||'all');
  filteredCharacters=characters.filter(c=>{
    if(q && !c.name.toLowerCase().includes(q)) return false;
    if(rf!=='all' && c.rarity!==rf) return false;
    if(ef!=='all' && c.element!==ef) return false;
    return true;
  });

      slots.push(id);

    await api('/api/account/team','PUT',{slots});
    await loadTeam();
    await loadCharacters();
    toast('⚔️ Time atualizado!');

function renderItems(){
  const tabs=[['all','Todos'],['potion','🧪 Poções'],['food','🍖 Alimentos'],['material','📦 Materiais'],['ticket','🎫 Tickets']];
  let items=inventory;
  if(currentItemTab!=='all') items=inventory.filter(i=>i.item_type===currentItemTab);
  setViewHTML(`
    <div class="item-tabs">
      ${tabs.map(([k,l])=>`<button class="${currentItemTab===k?'active':''}" onclick="currentItemTab='${k}';loadInventory()">${l}</button>`).join('')}
    </div>
    <div class="item-list" id="itemList"></div>`);
  const list=document.getElementById('itemList');
  if(!items.length){ list.innerHTML='<div class="empty">Nenhum item aqui.</div>'; return; }
  list.innerHTML=items.map(i=>`
    <div class="item-card">
      <div class="info">
        <div class="iname">${itemIcon(i)} ${esc(i.item_name)} <span class="tag" style="border-color:${color(i.rarity)};color:${color(i.rarity)}">${i.rarity||'—'}</span></div>
        <div class="idesc">${describeItem(i)}</div>
      </div>
      <div class="qty">x${i.quantity}</div>
      ${(['potion','food'].includes(i.item_type))?`<button class="use-btn" onclick="startUseItem(${i.id})">Usar</button>`:''}
      ${i.item_type==='ticket'?`<button class="use-btn" onclick="useTicket(${i.id})">Usar</button>`:''}
    </div>`).join('');
}
function itemIcon(i){
  const icons={potion:'🧪',food:'🍖',material:'📦',ticket:'🎫',equipment:'⚔️'};
  return icons[i.item_type]||'📦';
}
function describeItem(i){
  const s=i.stats||{};
  if(i.item_type==='food') return `+${s.xp||50} XP e cura ${s.heal_percent||30}% do HP`;
  if(i.item_type==='potion') return s.heal_percent?`Cura ${s.heal_percent}% do HP máximo`:`Cura ${s.heal||1000} HP`;
  if(i.item_type==='ticket') return `+${s.gems||100} gems`;
  if(i.item_type==='material') return 'Material de evolução';
  return '';
}

  const bossPct=Math.max(0,Math.min(100,Math.round((bossCurHp/bossMaxHp)*100)));

  // Monta os cards do time
  const teamCards=team.map(c=>{
    const maxHp=c.max_hp||c.hp;
    const pct=maxHp?Math.max(0,Math.min(100,Math.round((c.hp/maxHp)*100))):0;

    return `

        </div>
      </div>`;
  }).join('');

  openModal(d.victory?'⚔️ Batalha':'⚔️ Batalha',`
    <div class="battle-scene" id="battleScene">
      <div class="battle-side left">
        <div class="battle-avatar" id="bossAvatar">
          ${boss.image_url?`<img src="${esc(boss.image_url)}">`:'👹'}
        </div>
        <div class="battle-name">${esc(boss.name)} <span class="tag">${boss.difficulty}</span></div>
        <div class="battle-hp-wrap">
          <div class="battle-hp-label">HP do Boss</div>
          <div class="battle-hp-bar"><div class="battle-hp-fill ${bossPct<30?'low':bossPct<60?'mid':''}" id="bossHpFill" style="width:${bossPct}%"></div><div class="battle-hp-text" id="bossHpText">${fmt(bossCurHp)}/${fmt(bossMaxHp)}</div></div>
        </div>

      <button class="btn-skip" onclick="skipBattle()">⏩ Pular animação</button>
      <button class="btn-again" onclick="closeModal();openBosses()">⚔️ Lutar novamente</button>
      <button class="btn-back" onclick="closeModal()">✕ Fechar</button>
    </div>
  `);

  // Inicia o replay da batalha
  startBattleReplay(d);
}

function startBattleReplay(d){
  if(battleTimer){ clearInterval(battleTimer); battleTimer=null; }
  const events=d.events||[];
  const logBox=document.getElementById('battleLog');
  let idx=0;
  const bossAvatar=document.getElementById('bossAvatar');
  const bossHpFill=document.getElementById('bossHpFill');
  const bossHpText=document.getElementById('bossHpText');
  const bossMaxHp=d.boss.hp;

  // Estado inicial do HP
  const teamHp={};
  d.team_status.forEach(c=>{ teamHp[c.id]=c.hp; });

  function updateBossHp(hp){
    const pct=Math.max(0,Math.min(100,Math.round((hp/bossMaxHp)*100)));
    if(bossHpFill){
      bossHpFill.style.width=pct+'%';
      bossHpFill.className='battle-hp-fill '+(pct<30?'low':pct<60?'mid':'');
    }
    if(bossHpText) bossHpText.textContent=fmt(hp)+'/'+fmt(bossMaxHp);
  }
  function updateCharHp(id,hp){
    const fill=document.getElementById('bhp-'+id);
    const unit=document.getElementById('bu-'+id);
    if(!fill) return;
    const maxHp=d.team_status.find(c=>c.id===id)?.max_hp||hp;
    const pct=maxHp?Math.max(0,Math.min(100,Math.round((hp/maxHp)*100))):0;
    fill.style.width=pct+'%';
    fill.className='battle-hp-fill '+(pct<30?'low':pct<60?'mid':'');
    if(unit){
      const text=unit.querySelector('.battle-hp-text');
      if(text) text.textContent=fmt(hp)+'/'+fmt(maxHp);
    }
  }
  function showDmg(targetEl, dmg, isHeal){
    if(!targetEl) return;
    const rect=targetEl.getBoundingClientRect();
    const num=document.createElement('div');
    num.className='dmg-num'+(isHeal?' heal':'');
    num.textContent=(isHeal?'+':'-')+fmt(dmg);
    num.style.left=(rect.left+rect.width/2-20)+'px';
    num.style.top=(rect.top+10)+'px';
    document.body.appendChild(num);
    setTimeout(()=>num.remove(),1000);
  }
  function shake(el){
    if(!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }
  function addLogLine(text, cls){
    if(!logBox) return;
    const div=document.createElement('div');
    div.className=cls||'';
    div.textContent='• '+text;
    logBox.appendChild(div);
    logBox.scrollTop=logBox.scrollHeight;
  }

  battleTimer=setInterval(()=>{
    if(idx>=events.length){
      clearInterval(battleTimer);
      battleTimer=null;
      // Mostra o resultado final
      showBattleResult(d);
      return;
    }
    const ev=events[idx];
    idx++;

    if(ev.type==='player_attack'){
      playSound('attack');
      // Anima o personagem atacando
      const atkEl=document.getElementById('bav-'+ev.attacker_id);
      if(atkEl){
        const gif=ev.attacker_id?d.team_status.find(c=>c.id===ev.attacker_id)?.gif_attack_url:null;
        if(gif) atkEl.innerHTML=`<img src="${esc(gif)}">`;
        shake(atkEl);
        setTimeout(()=>{
          const idle=d.team_status.find(c=>c.id===ev.attacker_id)?.image_idle_url||d.team_status.find(c=>c.id===ev.attacker_id)?.image_url;
          if(idle) atkEl.innerHTML=`<img src="${esc(idle)}">`;
        },600);
      }
      // Shake no boss
      shake(bossAvatar);
      showDmg(bossAvatar, ev.damage);
      updateBossHp(ev.boss_hp);
      addLogLine(`Turno ${ev.turn}: ${ev.attacker} causa ${ev.damage_formatted} de dano no boss.`,'log-player');
    }
    else if(ev.type==='boss_attack'){
      playSound('hit');
      // Anima o boss atacando
      if(bossAvatar && boss.gif_attack_url){
        bossAvatar.innerHTML=`<img src="${esc(boss.gif_attack_url)}">`;
        setTimeout(()=>{
          if(boss.image_url) bossAvatar.innerHTML=`<img src="${esc(boss.image_url)}">`;
        },600);
      }
      shake(bossAvatar);
      // Dano no personagem
      const targetEl=document.getElementById('bav-'+ev.target_id);
      shake(targetEl);
      showDmg(targetEl, ev.damage);
      updateCharHp(ev.target_id, ev.char_hp);
      addLogLine(`Turno ${ev.turn}: ${ev.attacker} causa ${ev.damage_formatted} de dano em ${ev.target}.`,'log-boss');
    }
    else if(ev.type==='player_defeated'){
      playSound('defeat');
      const targetEl=document.getElementById('bav-'+ev.target_id);
      if(targetEl){
        targetEl.style.opacity='0.3';
        targetEl.style.filter='grayscale(100%)';
      }
      updateCharHp(ev.target_id, 0);
      addLogLine(`${ev.target} foi derrotado!`,'log-death');
    }
  }, 800);
}

function skipBattle(){
  if(battleTimer){ clearInterval(battleTimer); battleTimer=null; }
  if(battleData) showBattleResult(battleData);
}

function showBattleResult(d){
  const logBox=document.getElementById('battleLog');
  if(logBox){
    logBox.innerHTML='';
    d.log.forEach(l=>{
      const div=document.createElement('div');
      div.textContent='• '+l;
      logBox.appendChild(div);
    });
    logBox.scrollTop=logBox.scrollHeight;
  }
  // Mostra o resultado
  const scene=document.getElementById('battleScene');
  if(!scene) return;
  if(d.victory){
    playSound('victory');
    launchConfetti();
  } else {
    playSound('defeat');
  }
  const dropsHtml=d.drops&&d.drops.length?d.drops.map(x=>`<span class="drop-item">📦 ${esc(x.item_name)} x${x.quantity}</span>`).join(''):'<span style="color:#999">Nenhum drop</span>';
  const resultDiv=document.createElement('div');
  resultDiv.className='battle-result';
  resultDiv.innerHTML=`
    <div class="result-icon">${d.victory?'🏆':'💀'}</div>
    <h2 style="color:${d.victory?'var(--green)':'var(--accent)'}">${d.victory?'VITÓRIA!':'DERROTA...'}</h2>
    <p style="font-weight:700;margin-bottom:10px">${d.victory?'Você derrotou '+esc(d.boss.name)+'!':'Você foi derrotado por '+esc(d.boss.name)+'.'}</p>
    ${d.victory?`<div style="margin-bottom:8px"><strong>Drops:</strong><br>${dropsHtml}</div>`:''}
    <div class="stat-row"><span>HP restante do boss</span><span>${d.boss_hp_formatted}</span></div>
  `;
  scene.appendChild(resultDiv);
}

// ====== Confete ======
function launchConfetti(){
  const colors=['#ff3b3b','#ffc93c','#3ddc84','#4f9dde','#b388ff','#ff8c00'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.width=(Math.random()*8+4)+'px';
    c.style.height=(Math.random()*8+4)+'px';
    c.style.animationDuration=(Math.random()*2+2)+'s';
    c.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

async function openMissions(){

    for(const [type,label] of sections){

        return `

// ====== CENA DE BATALHA (PvP) ======
function showPvPBattle(d){
  const myTeam=d.attacker_team||[];
  const oppTeam=d.defender_team||[];
  const events=d.events||[];

  // Monta os times
  function teamCards(team, prefix){
    return team.map(c=>{
      const maxHp=c.max_hp||c.hp;
      const pct=maxHp?Math.max(0,Math.min(100,Math.round((c.hp/maxHp)*100))):0;
      const img=c.image_idle_url||c.image_url;
      return `
        <div class="battle-unit" id="${prefix}-${c.user_character_id}">
          <div class="battle-avatar small" id="${prefix}-av-${c.user_character_id}">${img?`<img src="${esc(img)}">`:'🎭'}</div>
          <div class="battle-name">${esc(c.name)}</div>
          <div class="battle-hp-wrap">
            <div class="battle-hp-bar"><div class="battle-hp-fill ${pct<30?'low':pct<60?'mid':''}" id="${prefix}-hp-${c.user_character_id}" style="width:${pct}%"></div><div class="battle-hp-text">${fmt(c.hp)}/${fmt(maxHp)}</div></div>
          </div>
        </div>`;
    }).join('');
  }

  openModal(d.victory?'🏆 Vitória!':'💀 Derrota...',`
    <div class="battle-scene" id="battleScene">
      <div class="battle-side left">
        <div style="font-weight:900;color:#fff;text-shadow:2px 2px 0 #000;margin-bottom:8px">${esc(d.opponent.username)}</div>
        <div class="battle-team">${teamCards(oppTeam,'opp')}</div>
      </div>
      <div class="battle-side right">
        <div style="font-weight:900;color:#fff;text-shadow:2px 2px 0 #000;margin-bottom:8px">Seu Time</div>
        <div class="battle-team">${teamCards(myTeam,'my')}</div>
      </div>
      <div style="clear:both"></div>
      <div class="battle-log" id="battleLog"></div>
    </div>
    <div class="battle-actions">
      <button class="btn-skip" onclick="skipBattle()">⏩ Pular animação</button>
      <button class="btn-again" onclick="closeModal();openPvP()">⚔️ Lutar novamente</button>
      <button class="btn-back" onclick="closeModal()">✕ Fechar</button>
    </div>
  `);

  // Replay
  if(battleTimer){ clearInterval(battleTimer); battleTimer=null; }
  const logBox=document.getElementById('battleLog');
  let idx=0;

  function getEl(prefix,id){ return document.getElementById(prefix+'-av-'+id); }
  function getHpEl(prefix,id){ return document.getElementById(prefix+'-hp-'+id); }
  function updateHp(prefix,id,hp){
    const fill=getHpEl(prefix,id);
    const unit=document.getElementById(prefix+'-'+id);
    if(!fill) return;
    const team=prefix==='my'?myTeam:oppTeam;
    const maxHp=team.find(c=>c.user_character_id===id)?.max_hp||hp;
    const pct=maxHp?Math.max(0,Math.min(100,Math.round((hp/maxHp)*100))):0;
    fill.style.width=pct+'%';
    fill.className='battle-hp-fill '+(pct<30?'low':pct<60?'mid':'');
    if(unit){
      const text=unit.querySelector('.battle-hp-text');
      if(text) text.textContent=fmt(hp)+'/'+fmt(maxHp);
    }
  }
  function showDmg(el,dmg){
    if(!el) return;
    const rect=el.getBoundingClientRect();
    const num=document.createElement('div');
    num.className='dmg-num';
    num.textContent='-'+fmt(dmg);
    num.style.left=(rect.left+rect.width/2-20)+'px';
    num.style.top=(rect.top+10)+'px';
    document.body.appendChild(num);
    setTimeout(()=>num.remove(),1000);
  }
  function shake(el){
    if(!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }
  function addLogLine(text,cls){
    if(!logBox) return;
    const div=document.createElement('div');
    div.className=cls||'';
    div.textContent='• '+text;
    logBox.appendChild(div);
    logBox.scrollTop=logBox.scrollHeight;
  }

  battleTimer=setInterval(()=>{
    if(idx>=events.length){
      clearInterval(battleTimer);
      battleTimer=null;
      showPvPResult(d);
      return;
    }
    const ev=events[idx];
    idx++;
    playSound('attack');
    // Determina se o atacante é do meu time ou do oponente
    const isMyAttack=myTeam.some(c=>c.user_character_id===ev.attacker_id);
    const atkPrefix=isMyAttack?'my':'opp';
    const tgtPrefix=isMyAttack?'opp':'my';
    const atkEl=getEl(atkPrefix,ev.attacker_id);
    const tgtEl=getEl(tgtPrefix,ev.target_id);
    shake(atkEl);
    shake(tgtEl);
    showDmg(tgtEl,ev.damage);
    updateHp(tgtPrefix,ev.target_id,ev.target_hp);
    addLogLine(`Turno ${ev.turn}: ${ev.attacker} ataca ${ev.target} (-${ev.damage_formatted})`,isMyAttack?'log-player':'log-boss');
    if(ev.type==='defeated'){
      if(tgtEl){ tgtEl.style.opacity='0.3'; tgtEl.style.filter='grayscale(100%)'; }
      addLogLine(`${ev.target} foi derrotado!`,'log-death');
    }
  },800);
}

function showPvPResult(d){

  if(logBox){
    logBox.innerHTML='';
    d.log.forEach(l=>{
      const div=document.createElement('div');
      div.textContent='• '+l;
      logBox.appendChild(div);

    logBox.scrollTop=logBox.scrollHeight;

  const scene=document.getElementById('battleScene');

            <div class="iname">${esc(it.name)} <span class="tag" style="border-color:${color(it.rarity)};color:${color(it.rarity)}">${it.rarity}</span></div>
            <div style="font-size:.72em;color:#555;font-weight:700">${esc(it.description)}</div>
            <div class="item-price">${price}</div>
          </div>
        </div>
        <button onclick="buyShopItem('${it.id}')">Comprar</button>
      </div>`;
    }).join('');
    html+=`<div style="font-weight:900;font-size:1em;margin:12px 0 8px">💰 Venda de Personagens</div>
    <div style="font-size:.8em;font-weight:700;display:grid;grid-template-columns:1fr 1fr;gap:4px">
      <div>Common: 100🪙</div><div>Rare: 500🪙</div>
      <div>Epic: 2.000🪙</div><div>Legendary: 20💎</div>
      <div>Mythic: 50💎</div><div>Secret: 100💎</div>
    </div>
    <div style="font-size:.7em;color:#555;font-weight:700;margin-top:6px">💡 Lendários+ são vendidos por gems automaticamente ao deletar.</div>`;
    openModal('🏪 Loja',html);
  }catch(e){ toast(e.message,true); closeModal(); }
}
async function buyShopItem(id){
  try{
    const d=await api('/api/shop/buy','POST',{item_id:id,quantity:1});
    playSound('click');
    toast('✅ '+d.message);
    await refreshAll();
    openShop();
  }catch(e){ toast(e.message,true); }
}

// ====== Inicialização ======
document.getElementById('loginScreen').style.display='flex';
document.getElementById('app').style.display='none';
if(token){
  enterGame().catch(()=>logout());
}
</script>
