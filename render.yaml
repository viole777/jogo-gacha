# =============================================
# Deploy no Render com persistência de dados
# =============================================
# Este arquivo configura o deploy automático no Render.
# Para usar:
#   1. Commit este arquivo na raiz do repo
#   2. Crie um "Web Service" no painel do Render
#   3. Conecte seu repositório (GitHub/GitLab)
#   4. O Render detecta render.yaml automaticamente
#
# Persistent storage requires the Starter plan:
#   - 512 MB RAM / 0.5 vCPU
#   - Persistent disk mounted at /var/data
#   - HTTP em https://seu-servico.onrender.com
#   - SQLite usado localmente no disco persistente
#
# Observações importantes:
#   - O seed() só complementa o catálogo; dados dos jogadores ficam no disco
#   - O banco sobrevive a redeploy e reinício do serviço

services:
  - type: web
    name: gacha-game-api
    region: oregon
    plan: starter
    env: node
    # Build: instala dependências Node.js (inclui better-sqlite3)
    buildCommand: npm install --production
    # Start: inicia o servidor Express (usa PORT do ambiente do Render)
    startCommand: node server/index.js
    # Health check para o load balancer do Render
    healthCheckPath: /api/health
    # Timeout de startup (segundos) - seed pode levar alguns segundos
    startupTimeout: 120
    disk:
      name: gacha-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/gacha-game.db
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_INTERVAL_MS
        value: "900000"
      - key: JWT_EXPIRES_IN
        value: 7d
      # Configure JWT_SECRET e ADMIN_PASSWORD como secrets no painel do Render.